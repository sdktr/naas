apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: naas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-p", "4222", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["wget", "--spider", "-q", "http://localhost:8222/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["wget", "--spider", "-q", "http://localhost:8222/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 5
