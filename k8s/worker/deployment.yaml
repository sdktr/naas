apiVersion: apps/v1
kind: Deployment
metadata:
  name: naas-worker
  namespace: naas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: naas-worker
  template:
    metadata:
      labels:
        app: naas-worker
    spec:
      containers:
        - name: naas-worker
          image: ghcr.io/lykinsbd/naas:2.0.0
          command:
            - python
            - worker.py
            - --nats-servers
            - $(NATS_SERVERS)
            - $(NAAS_WORKER_PROCESSES)
          envFrom:
            - configMapRef:
                name: naas-config
          env:
            - name: NAAS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: naas-secret
                  key: NAAS_ENCRYPTION_KEY
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - find
                - /tmp/worker_heartbeat
                - -mmin
                - "-2"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
