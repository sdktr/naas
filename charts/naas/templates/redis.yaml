{{- if .Values.nats.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "naas.labels" . | nindent 4 }}
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        {{- include "naas.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}
          args:
            - -js
            - -p
            - {{ .Values.nats.port | quote }}
            - -m
            - {{ .Values.nats.monitorPort | quote }}
          ports:
            - containerPort: {{ .Values.nats.port }}
            - containerPort: {{ .Values.nats.monitorPort }}
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["wget", "--spider", "-q", "http://localhost:{{ .Values.nats.monitorPort }}/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["wget", "--spider", "-q", "http://localhost:{{ .Values.nats.monitorPort }}/healthz"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "naas.labels" . | nindent 4 }}
    app: nats
spec:
  selector:
    app: nats
  ports:
    - port: {{ .Values.nats.port }}
      targetPort: {{ .Values.nats.port }}
{{- end }}
