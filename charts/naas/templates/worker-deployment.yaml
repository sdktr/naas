apiVersion: apps/v1
kind: Deployment
metadata:
  name: naas-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "naas.labels" . | nindent 4 }}
    app: naas-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: naas-worker
  template:
    metadata:
      labels:
        app: naas-worker
        {{- include "naas.labels" . | nindent 8 }}
    spec:
      containers:
        - name: naas-worker
          image: {{ include "naas.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - worker.py
            - --nats-servers
            - $(NATS_SERVERS)
            - $(NAAS_WORKER_PROCESSES)
          envFrom:
            - configMapRef:
                name: naas-config
          env:
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
            - name: NAAS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "naas.secretName" . }}
                  key: NAAS_ENCRYPTION_KEY
                  optional: true
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort }}
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - find
                - /tmp/worker_heartbeat
                - -mmin
                - "-2"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
