services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    networks:
      - naas
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api:
    image: naas:1.0.0a1
    build:
      context: ../..
      dockerfile: packages/naas/Dockerfile
    ports:
      - "${NAAS_GLOBAL_PORT:-8443}:443"
    environment:
      - NATS_SERVERS=${NATS_SERVERS:-nats://nats:4222}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-dev}
      - NAAS_CERT=${NAAS_CERT}
      - NAAS_KEY=${NAAS_KEY}
      - NAAS_CA_BUNDLE=${NAAS_CA_BUNDLE}
    networks:
      - naas
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  worker:
    image: naas:1.0.0a1
    build:
      context: ../..
      dockerfile: packages/naas/Dockerfile
    command: >-
      python worker.py
      --nats-servers ${NATS_SERVERS:-nats://nats:4222}
      ${NAAS_WORKER_PROCESSES:-100}
    environment:
      - NATS_SERVERS=${NATS_SERVERS:-nats://nats:4222}
    networks:
      - naas
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: ${NAAS_WORKER_REPLICAS:-2}

networks:
  naas:
    driver: bridge
